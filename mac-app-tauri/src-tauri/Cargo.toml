[package]
name = "remote-voice-tauri"
version = "0.4.0"
description = "remote-voice Rust/Tauri Mac client"
authors = ["remote-voice"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "remote_voice_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
cpal = "0.18.2"
dirs = "6.0.0"
hex = "0.4.3"
rand = "0.8.5"
rustls = { version = "0.23.34", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.23.0"
