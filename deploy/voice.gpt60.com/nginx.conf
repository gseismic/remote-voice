server {
    listen 80;
    listen [::]:80;
    server_name voice.gpt60.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-remote-voice;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://voice.gpt60.com$request_uri;
    }
}

# 证书签发后启用以下 HTTPS 虚拟主机。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voice.gpt60.com;

    ssl_certificate /etc/letsencrypt/live/voice.gpt60.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.gpt60.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /relay {
        if ($http_upgrade = "") { return 400; }
        proxy_pass http://127.0.0.1:19432;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = / {
        proxy_pass http://127.0.0.1:19432/healthz;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:19432;
    }

    location / {
        return 404;
    }
}
