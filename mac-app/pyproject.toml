[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-voice-mac"
version = "0.3.0"
description = "remote-voice Mac 端：图形客户端（GUI）与轻接收器（CLI）"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
remote-voice-gui = "macapp.main_gui:main"
remote-voice-recv = "macapp.receiver_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
